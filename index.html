<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>CyberVault — Безопасное хранилище</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' blob: data: https://api.github.com;">

  <style>
    :root {
      --bg: #000000;
      --surface: rgba(18, 18, 24, 0.85);
      --surface-card: rgba(26, 26, 36, 0.72);
      --surface-active: rgba(40, 40, 56, 0.85);
      --border: rgba(255, 255, 255, 0.09);
      --border-accent: rgba(16, 185, 129, 0.4);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --danger: #ff453a;
      --text: #ffffff;
      --text-sub: #8e8e93;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      overflow-x: hidden;
      user-select: none;
    }

    .app-shell {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* НАВИГАЦИОННАЯ ШАПКА */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.2rem 1.2rem 0.2rem;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.22), rgba(16, 185, 129, 0.04));
      border: 1px solid rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.15);
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .ios-chip {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #e5e5ea;
      border: 1px solid var(--border);
      padding: 0.42rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .ios-chip:active {
      transform: scale(0.95);
      background: rgba(255, 255, 255, 0.16);
    }

    .ios-chip-admin {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.45);
      color: var(--accent);
    }

    /* КАРТОЧКИ (LIQUID GLASS) */
    .glass-card {
      background: var(--surface);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 1.5rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6);
      margin-bottom: 1.2rem;
    }

    .glass-card h2 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.1rem;
    }

    /* ФОРМЫ (СТРОГО 16px ДЛЯ SAFARI) */
    .field-box {
      margin-bottom: 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding-left: 0.2rem;
    }

    input[type="text"],
    input[type="password"],
    input[type="file"],
    select {
      width: 100%;
      background: rgba(10, 10, 14, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.95rem 1.1rem;
      border-radius: 16px;
      font-size: 16px; /* Исключает автозум Safari */
      outline: none;
      transition: all 0.2s;
      user-select: text;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: #000;
      border: none;
      padding: 1rem;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.25);
      transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.2s;
    }

    .btn-submit:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .btn-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: rgba(255, 69, 58, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 69, 58, 0.35);
    }

    /* УВЕДОМЛЕНИЯ */
    .system-banner {
      padding: 0.9rem 1.1rem;
      border-radius: 14px;
      font-size: 0.85rem;
      margin-bottom: 1.1rem;
      display: none;
      line-height: 1.45;
      word-break: break-word;
    }

    .system-banner.error {
      display: block;
      background: rgba(255, 69, 58, 0.15);
      border: 1px solid rgba(255, 69, 58, 0.35);
      color: #ff9f97;
    }

    .system-banner.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #a7f3d0;
    }

    /* ФИЛЬТРЫ И СПИСОК ФАЙЛОВ */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 0.3rem;
      margin-bottom: 0.8rem;
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .filter-pills {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1rem;
      padding: 0 0.2rem;
    }

    .filter-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-pill.active {
      background: rgba(16, 185, 129, 0.16);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--accent);
    }

    .items-stream {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-bottom: 9rem;
    }

    .item-card {
      background: var(--surface-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 19px;
      padding: 0.9rem 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .item-card:active {
      transform: scale(0.98);
      background: var(--surface-active);
    }

    .item-card.is-active {
      border-color: var(--border-accent);
      background: rgba(16, 185, 129, 0.08);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.12);
    }

    .item-icon-box {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1c1c26, #121218);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .item-icon-box.pdf {
      color: #ff453a;
      background: linear-gradient(135deg, rgba(255, 69, 58, 0.15), #181214);
      border-color: rgba(255, 69, 58, 0.25);
    }

    .item-card.is-active .item-icon-box.audio {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: #000;
      border-color: transparent;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 0.98rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-card.is-active .item-title {
      color: var(--accent);
    }

    .item-sub {
      font-size: 0.76rem;
      color: var(--text-sub);
      margin-top: 0.2rem;
    }

    /* ЭКВАЛАЙЗЕР */
    .mini-eq {
      display: none;
      align-items: flex-end;
      gap: 2.5px;
      height: 16px;
      padding-right: 0.2rem;
    }

    .item-card.is-playing .mini-eq {
      display: flex;
    }

    .eq-col {
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      animation: eqJiggle 1s ease-in-out infinite alternate;
    }

    .eq-col:nth-child(1) { height: 14px; animation-delay: 0.1s; }
    .eq-col:nth-child(2) { height: 8px; animation-delay: 0.35s; }
    .eq-col:nth-child(3) { height: 16px; animation-delay: 0.2s; }

    @keyframes eqJiggle {
      0% { height: 4px; }
      100% { height: 16px; }
    }

    /* КАСТОМНЫЙ ПЛЕЕР (ПАРЯЩИЙ ОСТРОВ IOS) */
    .player-dock {
      position: fixed;
      left: 1rem;
      right: 1rem;
      bottom: max(16px, env(safe-area-inset-bottom));
      max-width: 580px;
      margin: 0 auto;
      background: rgba(18, 18, 24, 0.94);
      backdrop-filter: blur(35px) saturate(180%);
      -webkit-backdrop-filter: blur(35px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 0.95rem 1.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      animation: popUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popUp {
      from { transform: translateY(80px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .dock-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }

    .dock-title-box {
      flex: 1;
      min-width: 0;
    }

    .dock-name {
      font-size: 0.94rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dock-badge {
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
      margin-top: 0.15rem;
    }

    /* ТАЙМЛАЙН */
    .scrubber-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .scrubber {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.1s;
    }

    .scrubber:active::-webkit-slider-thumb {
      transform: scale(1.4);
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }

    .dock-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      padding-top: 0.15rem;
    }

    .btn-ctrl {
      background: none;
      border: none;
      color: #e5e5ea;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-ctrl:active {
      transform: scale(0.85);
      color: var(--accent);
    }

    .btn-ctrl-main {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      box-shadow: 0 6px 18px rgba(255, 255, 255, 0.25);
    }

    .btn-ctrl-main:active {
      transform: scale(0.92);
      background: var(--accent);
    }

    /* ПОЛНОЭКРАННЫЙ ПРОСМОТРЩИК PDF ДЛЯ IOS */
    .pdf-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      animation: modalFade 0.25s ease-out;
    }

    @keyframes modalFade {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .pdf-header {
      padding: max(14px, env(safe-area-inset-top)) 1rem 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 24, 0.95);
      border-bottom: 1px solid var(--border);
    }

    .pdf-title {
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    .pdf-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #1c1c24;
    }

    /* АДМИН-ПАНЕЛЬ */
    .admin-nav {
      display: flex;
      gap: 0.35rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.6rem;
      margin-bottom: 1.2rem;
      overflow-x: auto;
    }

    .admin-tab {
      background: none;
      border: none;
      color: var(--text-sub);
      padding: 0.45rem 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .admin-tab.active {
      color: var(--accent);
      background: rgba(16, 185, 129, 0.14);
    }

    .catalog-manage-item {
      background: rgba(10, 10, 14, 0.75);
      border: 1px solid var(--border);
      padding: 0.85rem 1rem;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="app-shell">
  <!-- ВЕРХНИЙ БАР -->
  <header>
    <div class="brand-group">
      <div class="brand-badge">
        <svg class="brand-icon" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1 16l-4-4 1.41-1.41L11 14.17l6.59-6.59L19 9l-8 8z"/></svg>
      </div>
      <div class="brand-title">CyberVault</div>
    </div>
    <div class="header-actions" id="headerControls"></div>
  </header>

  <!-- 1. ЭКРАН ВХОДА -->
  <section class="glass-card" id="viewLogin">
    <h2>Безопасный доступ</h2>
    <div class="system-banner" id="bannerLogin"></div>
    <form onsubmit="onLoginSubmit(event)">
      <div class="field-box">
        <label>Логин пользователя</label>
        <input type="text" id="inputUser" placeholder="Ваш логин" required autocomplete="username" autocapitalize="none">
      </div>
      <div class="field-box">
        <label>Секретный пароль</label>
        <input type="password" id="inputPass" placeholder="Пароль доступа" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="btnLoginSubmit">Открыть защищенный Vault</button>
    </form>
  </section>

  <!-- 2. ЭКРАН СЛУШАТЕЛЯ / БИБЛИОТЕКИ -->
  <section class="hidden" id="viewListener">
    <div class="system-banner" id="bannerListener"></div>
    <div class="section-header">
      <div class="section-title">Хранилище</div>
      <div style="font-size: 0.8rem; color: var(--text-sub);" id="counterLabel">0 файлов</div>
    </div>

    <!-- Фильтры -->
    <div class="filter-pills">
      <button class="filter-pill active" onclick="setFilter('all', this)">Все</button>
      <button class="filter-pill" onclick="setFilter('audio', this)">Аудио</button>
      <button class="filter-pill" onclick="setFilter('pdf', this)">Документы PDF</button>
    </div>

    <!-- Список треков и документов -->
    <div class="items-stream" id="itemsContainer"></div>

    <!-- ПАРЯЩИЙ КАСТОМНЫЙ ПЛЕЕР -->
    <div class="player-dock hidden" id="customDock">
      <div class="dock-meta">
        <div class="dock-title-box">
          <div class="dock-name" id="dockTrackName">Загрузка...</div>
          <div class="dock-badge" id="dockTrackStatus">AES-256-GCM в RAM</div>
        </div>
      </div>

      <div class="scrubber-wrap">
        <input type="range" class="scrubber" id="dockScrubber" min="0" max="100" value="0">
        <div class="time-labels">
          <span id="labelCurrentTime">0:00</span>
          <span id="labelDuration">0:00</span>
        </div>
      </div>

      <div class="dock-controls">
        <button class="btn-ctrl" onclick="seekBy(-15)" title="Назад 15 сек">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
        </button>
        <button class="btn-ctrl btn-ctrl-main" id="btnPlayPause" onclick="togglePlayback()">
          <svg id="svgPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="svgPause" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn-ctrl" onclick="seekBy(15)" title="Вперед 15 сек">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>
        </button>
      </div>
    </div>
  </section>

  <!-- 3. ПРОСМОТРЩИК PDF -->
  <div class="pdf-modal hidden" id="pdfViewerModal">
    <div class="pdf-header">
      <div class="pdf-title" id="pdfViewerTitle">Документ PDF</div>
      <button class="ios-chip" onclick="closePdfViewer()">Готово</button>
    </div>
    <iframe class="pdf-frame" id="pdfViewerFrame"></iframe>
  </div>

  <!-- 4. ПАНЕЛЬ АДМИНИСТРАТОРА -->
  <section class="glass-card hidden" id="viewAdmin">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
      <h2>Администрирование</h2>
      <button class="ios-chip" onclick="showScreen('listener')">← В медиатеку</button>
    </div>

    <div class="admin-nav">
      <button class="admin-tab active" id="tabBtnUpload" onclick="switchAdminTab('upload')">Загрузить</button>
      <button class="admin-tab" id="tabBtnManage" onclick="switchAdminTab('manage')">Каталог</button>
      <button class="admin-tab" id="tabBtnUsers" onclick="switchAdminTab('users')">Пользователи</button>
      <button class="admin-tab" id="tabBtnDiag" onclick="switchAdminTab('diag')">Диагностика</button>
      <button class="admin-tab" id="tabBtnSync" onclick="switchAdminTab('sync')">GitHub</button>
    </div>

    <div class="system-banner" id="bannerAdmin"></div>

    <!-- Вкладка: Загрузка файлов (MP3 или PDF) -->
    <div id="tabContentUpload">
      <form onsubmit="onUploadFileSubmit(event)">
        <div class="field-box">
          <label>Тип файла</label>
          <select id="uploadTypeSelect" onchange="onTypeChanged()">
            <option value="audio">Аудиозапись (MP3, M4A, AAC, WAV)</option>
            <option value="pdf">Документ (PDF)</option>
          </select>
        </div>
        <div class="field-box">
          <label>Название записи / документа</label>
          <input type="text" id="uploadTitleInput" placeholder="Например: Секретный отчет №1" required>
        </div>
        <div class="field-box">

        <input type="text" id="inputGhRepo" value="misha12333211-ctrl/Esp">

  <!-- 5. ПЕРВИЧНАЯ НАСТРОЙКА -->
  <section class="glass-card hidden" id="viewInit">
    <h2>Инициализация хранилища</h2>

      Файл vault.json не обнаружен. Задайте логин и мастер-пароль Администратора.
    </p>
    <div class="system-banner" id="bannerInit"></div>

      <div class="field-box">
        <label>Логин Главного Администратора</label>
        <input type="text" id="initAdminUser" value="admin" required autocapitalize="none">
      </div>
      <div class="field-box">
        <label>Мастер-пароль (от 8 символов)</label>
        <input type="password" id="initAdminPass" placeholder="Пароль" required>

      <button type="submit" class="btn-submit">Сгенерировать мастер-ключ</button>
    </form>

<!-- Скрытый аудиоэлемент для Safari -->
<audio id="hardwareAudio" playsinline preload="auto" class="hidden"></audio>

<script>
  // СОСТОЯНИЕ В ОПЕРАТИВНОЙ ПАМЯТИ
  let state = {
    vaultData: null,
    vaultKey: null,
    currentUser: null,
    items: [],
    currentFilter: 'all',
    activeAudioIndex: -1,
    activeAudioBlobUrl: null,
    activePdfBlobUrl: null,
    isScrubbing: false,
    activeAbortController: null,
    loadingSessionId: 0
  };

  const hardwareAudio = document.getElementById('hardwareAudio');

  // БАЗОВЫЙ URL РЕПОЗИТОРИЯ
  function getBaseRepoUrl() {
    let p = window.location.pathname;
    if (!p.endsWith('/')) {
      const last = p.lastIndexOf('/');
      if (p.substring(last).includes('.')) {
        p = p.substring(0, last + 1);
      } else {
        p = p + '/';
      }
    }
    return window.location.origin + p;
  }

  // БЕЗОПАСНАЯ САНИТИЗАЦИЯ СТРОК (Защита от XSS)
  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // САНИТИЗАЦИЯ ИМЕНИ ФАЙЛА (Защита от Path Traversal)
  function cleanFilename(str) {
    return str.replace(/[^a-zA-Z0-9_\-\.]/g, '_');
  }

  // КРИПТОГРАФИЯ (AES-256-GCM + PBKDF2)
  async function sha256(str) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str.trim().toLowerCase()));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function bufToBase64(buf) {
    let binary = '';
    const bytes = new Uint8Array(buf);
    const len = bytes.byteLength;
    for (let i = 0; i < len; i += 0x8000) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 0x8000, len)));
    }
    return btoa(binary);
  }

  function base64ToBuf(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  async function deriveUserKey(password, saltUint8) {
    const keyMaterial = await crypto.subtle.importKey(
      "raw",
      new TextEncoder().encode(password),
      "PBKDF2",
      false,
      ["deriveKey"]
    );
    return await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: saltUint8, iterations: 250000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      true,
      ["encrypt", "decrypt"]
    );
  }

  // СТАРТ ПРИЛОЖЕНИЯ
  window.addEventListener('DOMContentLoaded', async () => {
    initAudioEngineEvents();
    initScrubberEvents();

    try {
      const vUrl = new URL('vault.json', getBaseRepoUrl()).href + `?_cb=${Date.now()}`;
      const res = await fetch(vUrl, { cache: 'no-store' });
      if (!res.ok) throw new Error('Not found');
      state.vaultData = await res.json();
      showScreen('login');
    } catch (_) {
      showScreen('init');
    }
  });

  function showScreen(screen) {
    document.getElementById('viewLogin').classList.toggle('hidden', screen !== 'login');
    document.getElementById('viewListener').classList.toggle('hidden', screen !== 'listener');
    document.getElementById('viewAdmin').classList.toggle('hidden', screen !== 'admin');
    document.getElementById('viewInit').classList.toggle('hidden', screen !== 'init');
    refreshHeaderUI();
  }

  function refreshHeaderUI() {
    const box = document.getElementById('headerControls');
    box.innerHTML = '';
    if (!state.currentUser) return;

    if (state.currentUser.role === 'admin') {
      const btnAdmin = document.createElement('button');
      btnAdmin.className = 'ios-chip ios-chip-admin';
      btnAdmin.textContent = '⚙️ Управление';
      btnAdmin.onclick = () => showScreen('admin');
      box.appendChild(btnAdmin);
    }

    const btnLogout = document.createElement('button');
    btnLogout.className = 'ios-chip';
    btnLogout.textContent = 'Выйти';
    btnLogout.onclick = logoutUser;
    box.appendChild(btnLogout);
  }

  function showBanner(id, msg, type) {
    const el = document.getElementById(id);
    el.innerHTML = msg;
    el.className = `system-banner ${type}`;
  }

  // ВХОД В СИСТЕМУ
  async function onLoginSubmit(e) {
    e.preventDefault();
    const user = document.getElementById('inputUser').value;
    const pass = document.getElementById('inputPass').value;
    const btn = document.getElementById('btnLoginSubmit');

    try {
      btn.disabled = true;
      showBanner('bannerLogin', 'Дешифрование мастер-ключа в памяти...', 'success');

      const uHash = await sha256(user);
      const record = state.vaultData.users[uHash];
      if (!record) throw new Error('Неверный логин или пароль.');

      const userKey = await deriveUserKey(pass, new Uint8Array(base64ToBuf(record.salt)));
      const rawVaultKey = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: new Uint8Array(base64ToBuf(record.iv)) },
        userKey,
        base64ToBuf(record.encKey)
      );

      state.vaultKey = await crypto.subtle.importKey(
        "raw",
        rawVaultKey,
        { name: "AES-GCM", length: 256 },
        true,
        ["encrypt", "decrypt"]
      );

      state.currentUser = { username: user, role: record.role, hash: uHash };

      // Расшифровываем манифест каталога
      const catIv = new Uint8Array(base64ToBuf(state.vaultData.catalog.iv));
      const decCatalog = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: catIv },
        state.vaultKey,
        base64ToBuf(state.vaultData.catalog.data)
      );
      state.items = JSON.parse(new TextDecoder().decode(decCatalog));

      renderLibrary();
      showScreen('listener');
    } catch (err) {
      showBanner('bannerLogin', 'Ошибка доступа: неверный пароль или поврежден ключ.', 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // ФИЛЬТРАЦИЯ И ОТРИСОВКА
  function setFilter(type, btn) {
    state.currentFilter = type;
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderLibrary();
  }

  function renderLibrary() {
    const list = document.getElementById('itemsContainer');
    list.innerHTML = '';

    const filtered = state.items.filter(item => {
      if (state.currentFilter === 'all') return true;
      if (state.currentFilter === 'audio') return (item.type || 'audio') === 'audio';
      if (state.currentFilter === 'pdf') return item.type === 'pdf';
      return true;
    });

    document.getElementById('counterLabel').textContent = `${state.items.length} файлов`;

    if (filtered.length === 0) {
      list.innerHTML = '<div style="color: var(--text-sub); text-align: center; padding: 3rem 1rem;">Хранилище пусто.</div>';
      return;
    }

    filtered.forEach(item => {
      const originalIndex = state.items.indexOf(item);
      const isAudio = (item.type || 'audio') === 'audio';
      const isActive = isAudio && state.activeAudioIndex === originalIndex;
      const isPlaying = isActive && !hardwareAudio.paused;

      const card = document.createElement('div');
      card.className = `item-card ${isActive ? 'is-active' : ''} ${isPlaying ? 'is-playing' : ''}`;
      card.onclick = () => {
        if (isAudio) {
          playAudioItem(originalIndex);
        } else {
          openPdfItem(originalIndex);
        }
      };

      card.innerHTML = `
        <div class="item-icon-box ${isAudio ? 'audio' : 'pdf'}">
          ${isAudio ? 
            `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>` : 
            `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>`
          }
        </div>
        <div class="item-info">
          <div class="item-title">${escapeHtml(item.title)}</div>
          <div class="item-sub">${isAudio ? 'Аудиозапись' : 'PDF Документ'} • ${escapeHtml(item.size || '')} • ${escapeHtml(item.date || '')}</div>
        </div>
        ${isAudio ? `
          <div class="mini-eq">
            <div class="eq-col"></div>
            <div class="eq-col"></div>
            <div class="eq-col"></div>
          </div>
        ` : ''}
      `;
      list.appendChild(card);
    });
  }

  // ЗАГРУЗКА ЗАШИФРОВАННЫХ БАЙТОВ (с отменой предыдущих)
  async function fetchEncryptedData(filename, signal) {
    const base = getBaseRepoUrl();
    const tryUrls = [
      new URL(`tracks/${filename}`, base).href,
      new URL(filename, base).href,
      new URL(`tracks/${encodeURIComponent(filename)}`, base).href,
      new URL(encodeURIComponent(filename), base).href
    ];

    let lastErr = '';
    for (const u of [...new Set(tryUrls)]) {
      try {
        const res = await fetch(u + `?_cb=${Date.now()}`, { cache: 'no-store', signal });
        if (res.ok) {
          const buf = await res.arrayBuffer();
          if (buf.byteLength < 16) throw new Error('Файл пуст');
          return buf;
        } else {
          lastErr = `HTTP ${res.status} (${u})`;
        }
      } catch (e) {
        if (e.name === 'AbortError') throw e;
        lastErr = `${e.message} (${u})`;
      }
    }
    throw new Error(`Файл не найден. ${lastErr}`);
  }

  // ПОЛНАЯ ОЧИСТКА АУДИОАППАРАТУРЫ (Решает зависание в Safari на 5 треке)
  function hardResetAudioEngine() {
    try {
      hardwareAudio.pause();
      hardwareAudio.removeAttribute('src');
      hardwareAudio.load();
    } catch (_) {}

    if (state.activeAudioBlobUrl) {
      URL.revokeObjectURL(state.activeAudioBlobUrl);
      state.activeAudioBlobUrl = null;
    }
  }

  // ВОСПРОИЗВЕДЕНИЕ АУДИО (Идеально без зависаний)
  async function playAudioItem(idx) {
    const item = state.items[idx];
    if (!item) return;

    // Прерываем предыдущие незавершенные сетевые загрузки
    if (state.activeAbortController) {
      state.activeAbortController.abort();
    }
    state.activeAbortController = new AbortController();
    const currentSession = ++state.loadingSessionId;

    state.activeAudioIndex = idx;
    renderLibrary();

    // 1. Немедленная синхронная разблокировка Safari при тапе пользователя
    hardResetAudioEngine();
    hardwareAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
    hardwareAudio.load();
    hardwareAudio.play().catch(() => {});

    const dock = document.getElementById('customDock');
    const nameEl = document.getElementById('dockTrackName');
    const statusEl = document.getElementById('dockTrackStatus');

    dock.classList.remove('hidden');
    nameEl.textContent = item.title;
    statusEl.textContent = 'Загрузка и дешифрование...';

    try {
      const buffer = await fetchEncryptedData(item.filename, state.activeAbortController.signal);
      if (currentSession !== state.loadingSessionId) return;

      const bytes = new Uint8Array(buffer);
      const iv = bytes.slice(0, 12);
      const ciphertext = bytes.slice(12);

      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        state.vaultKey,
        ciphertext
      );

      if (currentSession !== state.loadingSessionId) return;

      // Строго audio/mpeg для iOS Safari
      const blob = new Blob([decrypted], { type: 'audio/mpeg' });
      state.activeAudioBlobUrl = URL.createObjectURL(blob);

      hardwareAudio.src = state.activeAudioBlobUrl;
      statusEl.textContent = 'Расшифровано в RAM (AES-256)';
      
      const playPromise = hardwareAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          statusEl.textContent = 'Нажмите ▶ для воспроизведения';
        });
      }

      // iOS MediaSession Lockscreen API
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: item.title,
          artist: 'CyberVault',
          album: 'Зашифрованное хранилище'
        });
        navigator.mediaSession.setActionHandler('play', togglePlayback);
        navigator.mediaSession.setActionHandler('pause', togglePlayback);
        navigator.mediaSession.setActionHandler('seekbackward', () => seekBy(-15));
        navigator.mediaSession.setActionHandler('seekforward', () => seekBy(15));
      }
    } catch (err) {
      if (err.name === 'AbortError') return;
      showBanner('bannerListener', `Ошибка трека «${escapeHtml(item.title)}»: ${err.message}`, 'error');
      statusEl.textContent = 'Сбой дешифрования';
    }
  }

  // УПРАВЛЕНИЕ ПЛЕЕРОМ
  function togglePlayback() {
    if (!hardwareAudio.src) return;
    if (hardwareAudio.paused) {
      hardwareAudio.play().catch(() => {});
    } else {
      hardwareAudio.pause();
    }
  }

  function seekBy(seconds) {
    if (!hardwareAudio.duration) return;
    hardwareAudio.currentTime = Math.max(0, Math.min(hardwareAudio.currentTime + seconds, hardwareAudio.duration));
  }

  function formatDuration(sec) {
    if (isNaN(sec) || !isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
  }

  function initAudioEngineEvents() {
    const playSvg = document.getElementById('svgPlay');
    const pauseSvg = document.getElementById('svgPause');
    const scrubber = document.getElementById('dockScrubber');
    const curTime = document.getElementById('labelCurrentTime');
    const durTime = document.getElementById('labelDuration');

    hardwareAudio.addEventListener('play', () => {
      playSvg.classList.add('hidden');
      pauseSvg.classList.remove('hidden');
      renderLibrary();
    });

    hardwareAudio.addEventListener('pause', () => {
      playSvg.classList.remove('hidden');
      pauseSvg.classList.add('hidden');
      renderLibrary();
    });

    hardwareAudio.addEventListener('timeupdate', () => {
      if (state.isScrubbing) return;
      if (hardwareAudio.duration) {
        scrubber.value = (hardwareAudio.currentTime / hardwareAudio.duration) * 100;
        curTime.textContent = formatDuration(hardwareAudio.currentTime);
        durTime.textContent = formatDuration(hardwareAudio.duration);
      }
    });

    hardwareAudio.addEventListener('ended', () => {
      playSvg.classList.remove('hidden');
      pauseSvg.classList.add('hidden');
      // Поиск следующего аудиотрека
      let nextIdx = state.activeAudioIndex + 1;
      while (nextIdx < state.items.length && (state.items[nextIdx].type || 'audio') !== 'audio') {
        nextIdx++;
      }
      if (nextIdx < state.items.length) {
        playAudioItem(nextIdx);
      }
    });
  }

  function initScrubberEvents() {
    const scrubber = document.getElementById('dockScrubber');
    scrubber.addEventListener('input', () => {
      state.isScrubbing = true;
    });
    scrubber.addEventListener('change', () => {
      if (hardwareAudio.duration) {
        hardwareAudio.currentTime = (scrubber.value / 100) * hardwareAudio.duration;
      }
      state.isScrubbing = false;
    });
  }

  // ПРОСМОТРЩИК PDF
  async function openPdfItem(idx) {
    const item = state.items[idx];
    if (!item) return;

    const modal = document.getElementById('pdfViewerModal');
    const frame = document.getElementById('pdfViewerFrame');
    const title = document.getElementById('pdfViewerTitle');

    title.textContent = `Загрузка: ${item.title}...`;
    modal.classList.remove('hidden');

    try {
      const buffer = await fetchEncryptedData(item.filename);
      const bytes = new Uint8Array(buffer);
      const iv = bytes.slice(0, 12);
      const ciphertext = bytes.slice(12);

      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        state.vaultKey,
        ciphertext
      );

      if (state.activePdfBlobUrl) {
        URL.revokeObjectURL(state.activePdfBlobUrl);
      }

      const blob = new Blob([decrypted], { type: 'application/pdf' });
      state.activePdfBlobUrl = URL.createObjectURL(blob);

      frame.src = state.activePdfBlobUrl;
      title.textContent = item.title;
    } catch (e) {
      alert("Не удалось расшифровать документ: " + e.message);
      closePdfViewer();
    }
  }

  function closePdfViewer() {
    const modal = document.getElementById('pdfViewerModal');
    const frame = document.getElementById('pdfViewerFrame');
    frame.src = 'about:blank';
    modal.classList.add('hidden');
    if (state.activePdfBlobUrl) {
      URL.revokeObjectURL(state.activePdfBlobUrl);
      state.activePdfBlobUrl = null;
    }
  }

  // АДМИНИСТРАТИВНЫЕ ФУНКЦИИ
  function switchAdminTab(t) {
    ['upload', 'manage', 'users', 'diag', 'sync'].forEach(name => {
      document.getElementById(`tabContent${capitalize(name)}`).classList.toggle('hidden', name !== t);
      document.getElementById(`tabBtn${capitalize(name)}`).classList.toggle('active', name !== t);
    });
    if (t === 'manage') renderManageCatalog();
    if (t === 'users') renderUsersManage();
  }

  function onTypeChanged() {
    const type = document.getElementById('uploadTypeSelect').value;
    const input = document.getElementById('uploadFileInput');
    if (type === 'pdf') {
      input.accept = '.pdf,application/pdf';
    } else {
      input.accept = 'audio/*,.mp3,.m4a,.wav';
    }
  }

  // ЗАГРУЗКА И ШИФРОВАНИЕ НОВОГО ФАЙЛА
  async function onUploadFileSubmit(e) {
    e.preventDefault();
    const type = document.getElementById('uploadTypeSelect').value;
    const title = document.getElementById('uploadTitleInput').value.trim();
    const file = document.getElementById('uploadFileInput').files[0];
    const btn = document.getElementById('btnUploadSubmit');

    try {
      btn.disabled = true;
      showBanner('bannerAdmin', 'Шифрование файла AES-256-GCM...', 'success');

      const fileBuffer = await file.arrayBuffer();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        state.vaultKey,
        fileBuffer
      );

      const combined = new Uint8Array(12 + encrypted.byteLength);
      combined.set(iv, 0);
      combined.set(new Uint8Array(encrypted), 12);

      const cleanBaseName = cleanFilename(file.name.replace(/\.[^/.]+$/, ""));
      const filename = `${type}_${Date.now()}_${cleanBaseName}.enc`;

      state.items.push({
        id: filename,
        filename: filename,
        title: title,
        type: type,
        size: (file.size / (1024 * 1024)).toFixed(1) + ' MB',
        date: new Date().toLocaleDateString('ru-RU')
      });

      // Перешифровываем манифест
      await saveCatalogState();

      // GitHub API или ручной экспорт
      const token = document.getElementById('inputGhToken').value.trim();
      const repo = document.getElementById('inputGhRepo').value.trim();
      if (token && repo) {
        showBanner('bannerAdmin', 'Публикация в GitHub API...', 'success');
        await githubUploadOrUpdate(repo, `tracks/${filename}`, combined.buffer, `Add ${type}: ${title}`);
        await githubUploadOrUpdate(repo, 'vault.json', new TextEncoder().encode(JSON.stringify(state.vaultData, null, 2)), 'Update catalog manifest');
        showBanner('bannerAdmin', 'Файл зашифрован и успешно опубликован на GitHub!', 'success');
      } else {
        downloadDirectBlob(new Blob([combined]), filename);
        exportVaultDirectly();
        showBanner('bannerAdmin', `Зашифрованный ${filename} и обновленный vault.json скачаны. Поместите ${filename} в папку tracks/, а vault.json в корень.`, 'success');
      }

      document.getElementById('uploadTitleInput').value = '';
      document.getElementById('uploadFileInput').value = '';
    } catch (err) {
      showBanner('bannerAdmin', 'Ошибка шифрования: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  // УПРАВЛЕНИЕ КАТАЛОГОМ: УДАЛЕНИЕ ЗАПИСЕЙ
  function renderManageCatalog() {
    const box = document.getElementById('catalogManageList');
    box.innerHTML = '';

    if (state.items.length === 0) {
      box.innerHTML = '<div style="color: var(--text-sub); text-align: center; padding: 2rem;">Каталог пуст.</div>';
      return;
    }

    state.items.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'catalog-manage-item';
      div.innerHTML = `
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(item.title)}</div>
          <div style="font-size: 0.75rem; color: var(--text-sub);">${item.type === 'pdf' ? 'PDF' : 'Аудио'} • ${escapeHtml(item.filename)}</div>
        </div>
        <button class="ios-chip" style="color: var(--danger); border-color: rgba(255, 69, 58, 0.4);" onclick="deleteItemFromCatalog(${index})">Удалить</button>
      `;
      box.appendChild(div);
    });
  }

  async function deleteItemFromCatalog(index) {
    const item = state.items[index];
    if (!item) return;

    if (!confirm(`Вы действительно хотите удалить «${item.title}» из каталога?`)) return;

    try {
      showBanner('bannerAdmin', 'Обновление хранилища...', 'success');

      // Если удаляется текущий играющий трек
      if (state.activeAudioIndex === index) {
        hardResetAudioEngine();
        document.getElementById('customDock').classList.add('hidden');
        state.activeAudioIndex = -1;
      }

      state.items.splice(index, 1);
      await saveCatalogState();

      renderManageCatalog();
      renderLibrary();

      // Удаление через GitHub API при наличии токена
      const token = document.getElementById('inputGhToken').value.trim();
      const repo = document.getElementById('inputGhRepo').value.trim();
      if (token && repo) {
        await githubDeleteFile(repo, `tracks/${item.filename}`);
        await githubUploadOrUpdate(repo, 'vault.json', new TextEncoder().encode(JSON.stringify(state.vaultData, null, 2)), `Delete: ${item.title}`);
        showBanner('bannerAdmin', `Запись «${escapeHtml(item.title)}» удалена из каталога и с GitHub!`, 'success');
      } else {
        exportVaultDirectly();
        showBanner('bannerAdmin', `Запись «${escapeHtml(item.title)}» удалена. Обновленный vault.json скачан — замените его в репозитории на GitHub.`, 'success');
      }
    } catch (err) {
      showBanner('bannerAdmin', 'Ошибка удаления: ' + err.message, 'error');
    }
  }

  // ПЕРЕШИФРОВАНИЕ КАТАЛОГА
  async function saveCatalogState() {
    const catIv = crypto.getRandomValues(new Uint8Array(12));
    const encCatalog = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv: catIv },
      state.vaultKey,
      new TextEncoder().encode(JSON.stringify(state.items))
    );
    state.vaultData.catalog = { iv: bufToBase64(catIv), data: bufToBase64(encCatalog) };
  }

  // ПОЛЬЗОВАТЕЛИ
  async function onAddUserSubmit(e) {
    e.preventDefault();
    const user = document.getElementById('inputNewUser').value.trim();
    const pass = document.getElementById('inputNewPass').value.trim();

    try {
      const uHash = await sha256(user);
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const userKey = await deriveUserKey(pass, salt);

      const rawVaultKey = await crypto.subtle.exportKey("raw", state.vaultKey);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encKey = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, userKey, rawVaultKey);

      state.vaultData.users[uHash] = {
        role: "user",
        salt: bufToBase64(salt),
        iv: bufToBase64(iv),
        encKey: bufToBase64(encKey)
      };

      renderUsersManage();

      const token = document.getElementById('inputGhToken').value.trim();
      const repo = document.getElementById('inputGhRepo').value.trim();
      if (token && repo) {
        await githubUploadOrUpdate(repo, 'vault.json', new TextEncoder().encode(JSON.stringify(state.vaultData, null, 2)), `Add user: ${user}`);
        showBanner('bannerAdmin', `Пользователь ${escapeHtml(user)} добавлен и синхронизирован с GitHub!`, 'success');
      } else {
        exportVaultDirectly();
        showBanner('bannerAdmin', `Пользователь ${escapeHtml(user)} создан. Скачанный vault.json замените в репозитории GitHub.`, 'success');
      }

      document.getElementById('inputNewUser').value = '';
      document.getElementById('inputNewPass').value = '';
    } catch (e) {
      showBanner('bannerAdmin', 'Ошибка: ' + e.message, 'error');
    }
  }

  function renderUsersManage() {
    const box = document.getElementById('usersListRows');
    box.innerHTML = '';
    Object.keys(state.vaultData.users).forEach(hash => {
      const u = state.vaultData.users[hash];
      const div = document.createElement('div');
      div.style.cssText = 'background: rgba(10, 10, 14, 0.7); padding: 0.85rem 1rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 0.5rem;';
      div.innerHTML = `
        <div>
          <span style="font-family: monospace;">${hash.substring(0, 10)}...</span>
          <span style="color: var(--accent); margin-left: 0.5rem; font-weight: 600;">[${u.role}]</span>
        </div>
        ${u.role !== 'admin' ? `<button class="ios-chip" style="color: var(--danger);" onclick="revokeUserAccess('${hash}')">Удалить</button>` : '<span style="font-size: 0.75rem; color: var(--text-sub);">Администратор</span>'}
      `;
      box.appendChild(div);
    });
  }

  function revokeUserAccess(hash) {
    if (confirm('Отозвать доступ для этого пользователя?')) {
      delete state.vaultData.users[hash];
      renderUsersManage();
      exportVaultDirectly();
      showBanner('bannerAdmin', 'Пользователь удален. Обновите vault.json на GitHub.', 'success');
    }
  }

  // ДИАГНОСТИКА СВЯЗНОСТИ
  async function runDiagScan() {
    const out = document.getElementById('diagLogsOutput');
    out.innerHTML = 'Проверка файлов по прямым HTTP ссылкам...<br>';
    const base = getBaseRepoUrl();

    try {
      const v = await fetch(new URL('vault.json', base).href + `?_cb=${Date.now()}`, { cache: 'no-store' });
      out.innerHTML += `vault.json: ${v.ok ? '✅ Доступен (200 OK)' : '❌ Ошибка ' + v.status}<br>`;
    } catch (_) {
      out.innerHTML += `vault.json: ❌ Недоступен<br>`;
    }

    for (const it of state.items) {
      try {
        await fetchEncryptedData(it.filename);
        out.innerHTML += `<b>${escapeHtml(it.title)}</b> (${it.filename}): ✅ Файл найден на сервере<br>`;
      } catch (e) {
        out.innerHTML += `<b>${escapeHtml(it.title)}</b> (${it.filename}): ❌ 404 Не найден в репозитории!<br>`;
      }
    }
  }

  // GITHUB REST API ХЕЛПЕРЫ
  async function githubUploadOrUpdate(repo, path, contentBuffer, message) {
    const token = document.getElementById('inputGhToken').value.trim();
    const branch = document.getElementById('inputGhBranch').value.trim() || 'main';
    const url = `https://api.github.com/repos/${repo}/contents/${path}`;

    let sha = null;
    try {
      const g = await fetch(`${url}?ref=${branch}`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (g.ok) {
        const j = await g.json();
        sha = j.sha;
      }
    } catch (_) {}

    const p = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message,
        content: bufToBase64(contentBuffer),
        branch,
        ...(sha ? { sha } : {})
      })
    });

    if (!p.ok) {
      const err = await p.json();
      throw new Error(err.message || 'Ошибка GitHub API');
    }
  }

  async function githubDeleteFile(repo, path) {
    const token = document.getElementById('inputGhToken').value.trim();
    const branch = document.getElementById('inputGhBranch').value.trim() || 'main';
    const url = `https://api.github.com/repos/${repo}/contents/${path}`;

    try {
      const g = await fetch(`${url}?ref=${branch}`, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!g.ok) return;
      const j = await g.json();

      await fetch(url, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: `Delete ${path}`,
          sha: j.sha,
          branch
        })
      });
    } catch (_) {}
  }

  // ПЕРВИЧНАЯ ИНИЦИАЛИЗАЦИЯ
  async function onInitSubmit(e) {
    e.preventDefault();
    const user = document.getElementById('initAdminUser').value.trim();
    const pass = document.getElementById('initAdminPass').value.trim();

    try {
      const vaultKey = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
      const rawVaultKey = await crypto.subtle.exportKey("raw", vaultKey);

      const salt = crypto.getRandomValues(new Uint8Array(16));
      const userKey = await deriveUserKey(pass, salt);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encVaultKey = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, userKey, rawVaultKey);

      const userHash = await sha256(user);
      const tracksIv = crypto.getRandomValues(new Uint8Array(12));
      const encTracks = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: tracksIv },
        vaultKey,
        new TextEncoder().encode(JSON.stringify([]))
      );

      state.vaultData = {
        users: {
          [userHash]: {
            role: "admin",
            salt: bufToBase64(salt),
            iv: bufToBase64(iv),
            encKey: bufToBase64(encVaultKey)
          }
        },
        catalog: {
          iv: bufToBase64(tracksIv),
          data: bufToBase64(encTracks)
        }
      };

      exportVaultDirectly();
      showBanner('bannerInit', 'vault.json сгенерирован и скачан! Загрузите его в корень репозитория Esp и обновите страницу.', 'success');
    } catch (err) {
      showBanner('bannerInit', 'Ошибка: ' + err.message, 'error');
    }
  }

  // ЭКСПОРТ И ВЫХОД
  function exportVaultDirectly() {
    const blob = new Blob([JSON.stringify(state.vaultData, null, 2)], { type: "application/json" });
    downloadDirectBlob(blob, 'vault.json');
  }

  function downloadDirectBlob(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function logoutUser() {
    hardResetAudioEngine();
    closePdfViewer();
    state.vaultKey = null;
    state.currentUser = null;
    state.items = [];
    state.activeAudioIndex = -1;
    document.getElementById('customDock').classList.add('hidden');
    showScreen('login');
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
</script>
